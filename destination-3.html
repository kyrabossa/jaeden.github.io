<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisay Friends</title>

    <style>
        body {
            cursor: url("cursor.png") 0 0, auto;
        }

        button:hover,
        a:hover {
            cursor: url("cursor-hover.png") 0 0, pointer;
        }
        
        .beacon:hover {
            cursor: url("cursor-hover.png") 0 0, pointer;
        }

        .beacon.unavailable:hover {
            cursor: url("cursor.png") 0 0, auto;
        }

        body {
            margin: 0;
            background: black;
        }

        .ship-screen {
            container-type: inline-size;

            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .ship-background {
            display: block;
            width: 100%;
            height: auto;
        }

        .ready-text {
            position: absolute;

            left: 39.53%;
            top: 0%;
            width: 16.867%;

            height: auto;
            animation: ready-blink 1s steps(1, end) infinite;
        }

        @keyframes ready-blink {
            0%, 49% {
                content: url("ready-white.png");
            }

            50%, 100% {
                content: url("ready-yellow.png");
            }
        }

        .jump-button {
            position: absolute;
            left: 41.7%;
            top: 4.6875%;
            width: 5.86%;
            height: 4.167%;

            border: none;
            background: transparent;
            cursor: pointer;
        }
        
    
        .map-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.65);
        }

        .map-overlay.open {
            display: flex;
        }

        .map-panel {
            position: relative;
            width: 100%;
        }

        .map-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .route-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            opacity: 0;
            pointer-events: none;
        }
        .route-lines.current-route {
            opacity: 1;
        }
        
        .star-glow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }
        .star-glow.current-glow {
            opacity: 0;
        }

        .map-ship-orbit {
            position: absolute;
            width: 10%;
            aspect-ratio: 1;

            z-index: 5;
            pointer-events: none;
            animation: ship-orbit 8s linear infinite;
        }

        .map-ship-orbit img {
            position: absolute;
            width: 169.1%;
            height: auto;

            left: 80%;
            top: 45%;
            transform: translate(-50%, -50%);
        }

        @keyframes ship-orbit {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        .beacon {
            position: absolute;
            width: 3%;
            aspect-ratio: 1;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .beacon img {
            display: block;
            position: absolute;

            width: 563.67%;
            height: auto;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            object-fit: contain;
            pointer-events: none;
        }

        .beacon[data-star="1"] { left: 37.92%; top: 50%; }
        .beacon[data-star="2"] { left: 46.26647%; top: 32.03125%; }
        .beacon[data-star="3"] { left: 53.147877%; top: 43.61979%; }
        .beacon[data-star="4"] { left: 43.55%; top: 67.578125%; }
        .beacon[data-star="5"] { left: 58.931%; top: 72.786%; }
        .beacon[data-star="6"] { left: 70.058565%; top: 52.4739583%; }
        .beacon[data-star="7"] { left: 76.866764%; top: 32.9427%; }

        .map-exit-button {
            position: absolute;

            left: 73.1332%;
            top: 86.71875%;
            width: 9.736456808%;
            height: 4.296875%;

            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }

        .beacon.unavailable {
            cursor: default;
        }

        
        .alert {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: auto;
            transform: translate(-50%, -50%);

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index:1;
        }

        .alert.show {
            opacity: 1;
        }

        .message-box {
            position: absolute;
            top: 23.7%;
            left: 27.45%;
            right: 27.45%;
            font-family: "Box Font", sans-serif;
            font-size: clamp(8px, 1.25cqw, 16px);
            line-height: 1.4;
            color: white;
            text-align: left;
            z-index: 2;
            margin: 0;
            padding: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
            box-sizing: border-box;
        }

        .message-box.show {
            opacity: 1;
        }

        #next-button {
            display: none;
            margin-top: 12px;
        }

        @font-face {
            font-family: "Box Font";
            src: url("ST01R.TTF") format("truetype");
        }

        .continue-link {
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .continue-link:hover {
            color: yellow;
        }
    </style>
</head>

<body data-current-star="3">
    <div class="ship-screen">
        <img
            src="pisay-1.png"
            class="ship-background"
            alt="Ship screen"
        >

        <img
            src="ready-white.png"
            class="ready-text"
            alt="Ready"
        >

        <button
            class="jump-button"
            aria-label="Open beacon map"
            title="Open beacon map"
        ></button>

        
    <!-- map -->
    <div class="map-overlay" id="mapOverlay">
        <div class="map-panel">

            <img src="map.png" alt="Beacon map" class="map-image">

            <img src="lines-1.png" class="route-lines" id="lines-1" alt="">
            <img src="lines-2.png" class="route-lines" id="lines-2" alt="">
            <img src="lines-3.png" class="route-lines" id="lines-3" alt="">
            <img src="lines-4.png" class="route-lines" id="lines-4" alt="">
            <img src="lines-5.png" class="route-lines" id="lines-5" alt="">
            <img src="lines-6.png" class="route-lines" id="lines-6" alt="">
            <img src="lines-7.png" class="route-lines" id="lines-7" alt="">

            
            <img src="glow-1.png" class="star-glow" id="glow-1" alt="">
            <img src="glow-2.png" class="star-glow" id="glow-2" alt="">
            <img src="glow-3.png" class="star-glow" id="glow-3" alt="">
            <img src="glow-4.png" class="star-glow" id="glow-4" alt="">
            <img src="glow-5.png" class="star-glow" id="glow-5" alt="">
            <img src="glow-6.png" class="star-glow" id="glow-6" alt="">
            <img src="glow-7.png" class="star-glow" id="glow-7" alt="">

            
            <div class="map-ship-orbit" id="mapShipOrbit">
                <img src="map-ship.png" alt="Your ship">
            </div>

            <starting>
            <button class="beacon start-beacon" data-star="1"
                    aria-label="Starting beacon">
                <img src="star-blue.png" alt="">
            </button>

            <button class="beacon" data-star="2" aria-label="Beacon 2">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="3" aria-label="Beacon 3">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="4" aria-label="Beacon 4">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="5" aria-label="Beacon 5">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="6" aria-label="Beacon 6">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="7" aria-label="Beacon 7">
                <img src="star-yellow.png" alt="">
            </button>
            
            <button
                class="map-exit-button"
                id="mapExitButton"
                aria-label="Close map"
            ></button>
        </div>
    </div>

        <!-- alert image -->
    <img
        class="alert"
        id="birthday-alert"
        src="alert.png"
        alt="Birthday alert"
    >

    <!-- popup text -->
    <div class="message-box" id="message-box">

        
    <div id="message-content">
        You receive a hail from a station orbiting a nearby planet.
        <br>
        "Captain, we are Federation Terraforming Team P-Sci and are in need of assistance. Do you have some time?"
        <br><br>

        <a href="#" class="continue-link" id="prologue-choice">
            1. You offer your assistance.
        </a>
    </div>

        <a href="#" class="continue-link" id="next-button"
        style="display: none;">
            1. Next...
        </a>
        <br>
        <a href="#" class="continue-link" id="previous-button" 
        style="display:none;">
            2. Previous...
        </a>

        <br>
        
        <a href="#" class="continue-link" id="close-button"
        style="display: none;">
            3. Close and continue...
        </a>
    </div>
    </div>
    </div>

    <audio id="sector-music" src="sector-music.mp3" autoplay loop></audio>

    <script>
        const jumpButton = document.querySelector(".jump-button");
        const mapOverlay = document.getElementById("mapOverlay");
        const mapPanel = document.querySelector(".map-panel");

        // map
        jumpButton.addEventListener("click", () => {
            mapOverlay.classList.add("open");

            requestAnimationFrame(() => {
                positionShipOrbit();
            });
        });

        const mapExitButton = document.getElementById("mapExitButton");

        mapExitButton.addEventListener("click", (event) => {
            event.stopPropagation();
            mapOverlay.classList.remove("open");
        });

        const connections = {
            1: [2, 3, 4],
            2: [1, 3],
            3: [1, 2, 4, 5],
            4: [1, 3, 5],
            5: [3, 4, 6],
            6: [5, 7],
            7: [6]
        };

        const currentStar = Number(document.body.dataset.currentStar);
        const visitableStars = connections[currentStar] || [];
        
        const currentBeacon = document.querySelector(
            '.beacon[data-star="' + currentStar + '"]'
        );

        const mapShipOrbit = document.getElementById("mapShipOrbit");

        function positionShipOrbit() {
            if (!currentBeacon || !mapShipOrbit) return;

            const beaconRect = currentBeacon.getBoundingClientRect();
            const mapRect = mapPanel.getBoundingClientRect();

            if (mapRect.width === 0 || mapRect.height === 0) return;

            const x =
                ((beaconRect.left + beaconRect.width / 2 - mapRect.left)
                / mapRect.width) * 100;

            const y =
                ((beaconRect.top + beaconRect.height / 2 - mapRect.top)
                / mapRect.height) * 100;

            mapShipOrbit.style.left = (x-1) + "%";
            mapShipOrbit.style.top = (y-1) + "%";
            mapShipOrbit.style.marginLeft = "-5%";
            mapShipOrbit.style.marginTop = "-5%";
        }

        // stars
        document.querySelectorAll(".beacon").forEach((beacon) => {
            const starNumber = Number(beacon.dataset.star);
            const starImage = beacon.querySelector("img");
            const routeImage = document.getElementById("lines-" + starNumber);
            const glowImage = document.getElementById("glow-" + starNumber);

            if (!visitableStars.includes(starNumber)) {
                beacon.classList.add("unavailable");
            } else {
                beacon.classList.remove("unavailable");
            }

            if (starNumber === currentStar && routeImage) {
                routeImage.classList.add("current-route");
            }

            if (
                starNumber === 1 ||
                localStorage.getItem("beacon-" + starNumber) === "visited"
            ) {
                starImage.src = "star-blue.png";
                beacon.removeAttribute("title");
            } else {
                beacon.title = "An unvisited location.";
            }

            
            beacon.addEventListener("mouseenter", () => {
                if (routeImage) {
                    routeImage.style.opacity = "1";
                }

                if (glowImage) {
                    glowImage.style.opacity =
                        starNumber !== currentStar &&
                        visitableStars.includes(starNumber)
                            ? "1"
                            : "0";
                }
            });

            beacon.addEventListener("mouseleave", () => {
                if (routeImage) {
                    routeImage.style.opacity =
                        starNumber === currentStar ? "1" : "0";
                }

                if (glowImage) {
                    glowImage.style.opacity = "0";
                }
            });

            // visit
            beacon.addEventListener("click", (event) => {
                event.stopPropagation();

                if (!visitableStars.includes(starNumber)) {
                    return;
                }

                localStorage.setItem("beacon-" + starNumber, "visited");
                starImage.src = "star-blue.png";
                beacon.removeAttribute("title");

                mapOverlay.classList.remove("open");

                window.location.href = starNumber === 1
                    ? "start.html"
                    : "destination-" + starNumber + ".html";
            });
        });

        
        const alertBox = document.getElementById("birthday-alert");
        const messageBox = document.getElementById("message-box");
        const messageContent = document.getElementById("message-content");
        const nextButton = document.getElementById("next-button");
        const previousButton = document.getElementById("previous-button");
        const closeButton = document.getElementById("close-button");

        const transmissions = [
            [
                '"Happy birthday! You always bring a smile to people\'s faces wherever you go. I love you and wish you the best."\n\n— Randolf',
                '"to one of da silliest ppl i know,\n\nhappy birthday jaeden! ur energy for this year brings me to a recollection of the sound of water hitting a rock sitting beneath a waterfall. i hope that this day of your birth may bring forth reflection and peace within you, and i am manifesting all the best energy and things to come to you for this year. i hope that you find your year to be a fulfilling one and i am always rooting for you no matter where you go or what you do. ur my goat af, and i hope that this day is a good one. may the cats fly and the pigs swim for you.',
                'happy birthday 🎉\n\nlove sameowrah"— Samara',
                '"Starting my speech in 3..\n\nHAPPY BIRTHDAY!!! King I honor you so much for deciding to go to NDC right in the lead up to ur freaking bday ur insane... I know I dont show it often, but I love constantly hearing from you, whether it be career updates (highs and lows included!) or absolutely anything under the sun. As proud of you as I am from debater to debater, Im even more proud to be your friend. You have a way of lighting up a room full of people who haven\'t even gotten to know you, and honestly the world needs more people like you. Thanks for being an amazing friend all these years, the',
                'convos with you never get boring ^-^ Keep infecting people with joy, and enjoy your day!!!\n\nProud to propose,\nFranco"',
                '"Dear Jaeden,\n\nHAPPY BIRTHDAYYYYYYYYYYYYYYYYYYY, tanda mo na pre, magmano ba ko next time makita kita sa NIP? WAHAHAHAHAHAHHAAHHAAH\n\nI\'ll be informal but best believe it\'s sincere. Jaeden, genuinely you\'re one of the best people I\'ve gotten to know after the pandemic era. Maybe, I could have gotten to know you better during G9 pero lowkey I was so introverted to our section aside from the people I actually talked to. I was lucky to have been your dormmate during G10 cause damn pre you were such a fun',
                'guy to be around, and nakakatawa na lapag ka natulog for basically the entire year LOL.\n\nOn a side note, I think you know me well enough to know that i procrastinated AFFFF when i was writing this (I was playing Minecraft and reading manhwa in between). Okay continuing from the tangent, I enjoy the times we get to hang out recently, esp since the last time we got to do this often was with sylvia and barkia, ala chibog session. Hopefully, we can do one more chibog session in the future when sylvia visits again pero for now tara Eat UP ulit LOL, ansarap ng kape nila eh highkey.',
                'On another note, I miss playing games with you pre. I don\'t remember if we ever got to play terraria together, I think puro plano no actual yung nangyari pero let\'s see. Albion was a good thing to play too, although prob the fastest i got burnt out in. Finally, ML but tbh I\'m only really playing the game cause my fam still plays it occasionally, but if you ever get back to it just hit me up let\'s run some BULLSHIT LOLLL.\n\nThat\'s all from me jaeden. Habadu ulit, enjoy your day and see you next week if swertehin sa sched.\n\n— Aki"',
                '"happy birthday jaeden!! its crazy to think that back in the first half of high school, you were just someone id hear about on occasion from mutual friends every now and then. To now and we had spent two years working our asses off day in and day out on asthmalert.\n\ni genuinely owe so much of the confidence i now have to you. being with you made pisay a much more bearable and less alienating experience. hope you have a good one dude! sana makasama na ako furreal the next time we have a baguio gala or smthn :33 happy birthdayyyyy !!!!"— Dane',
                '"happiest birthday jaeden! out of all my friends in pisay ever, you have always been the most ambitious. the one who puts in the most heart. grade 7 was just the fucking around year (see: attached picture), but ever since then ive seen how much youve matured into someone who genuinely wants to improve and engage himself in the indulgence of what he loves. it is awe-inspiring how lost-in-the-sauce you can be when it comes to your specific interests, and its even sweeter when you seek out people to share your happiness with. until now, i still feel very touched every time i think about how consistent you were in sharing all things terraria, starcraft, or starsector. with that, i am so excited to see how this new decade in your life will play',
                'out, because i know you have much ambitions for yourself, and knowing you, i know you will put your whole heart into executing on all of them (today bs math + debate, tomorrow BSP GOVernor!). thats the jaeden i love and adore and respect!\n\n-love, marty"'
            ]
        ];

        const prologue = [
            {
                text: '"Thank you! We need to scan this planet for life before we can begin terraforming, but our sensors can\'t get the necessary power to scan through this atmosphere. We\'ve got a schedule to keep, any chance you can help?"',
                choice: "1. Attempt to scan the planet."
            },
            {
                text: "It seems your sensors are no more powerful than the terraformer\'s. You apologize.",
                choice: "1. Continue..."
            },
            {
                text: '"It\'s no problem. It\'s your birthday, right? The whole sector knows. We have something to say."',
                choice: "1. Continue..."
            }
        ];

        let currentTransmission = [];
        let currentMessage = 0;
        let hasReachedEnd = false;
        let currentPrologueStep = -1;

        setTimeout(() => {
            alertBox.classList.add("show");
            messageBox.classList.add("show");
        }, 1000);

        
        const prologueChoice = document.getElementById("prologue-choice");

        prologueChoice.addEventListener("click", (event) => {
            event.preventDefault();

            currentPrologueStep++;

            if (currentPrologueStep < prologue.length) {
                const scene = prologue[currentPrologueStep];

                messageContent.innerHTML =
                    scene.text.replace(/\n/g, "<br>") +
                    "<br><br>" +
                    '<a href="#" class="continue-link" id="prologue-choice">' +
                    scene.choice +
                    "</a>";

                // Reconnect the newly created choice
                document.getElementById("prologue-choice")
                    .addEventListener("click", handlePrologueChoice);

            } else {
                // Prologue finished: begin the friend messages
                currentTransmission = transmissions[0];
                currentMessage = 0;
                hasReachedEnd = false;

                showMessage();
            }
        });

        function handlePrologueChoice(event) {
            event.preventDefault();

            currentPrologueStep++;

            if (currentPrologueStep < prologue.length) {
                const scene = prologue[currentPrologueStep];

                messageContent.innerHTML =
                    scene.text.replace(/\n/g, "<br>") +
                    "<br><br>" +
                    '<a href="#" class="continue-link" id="prologue-choice">' +
                    scene.choice +
                    "</a>";

                document.getElementById("prologue-choice")
                    .addEventListener("click", handlePrologueChoice);
            } else {
                currentTransmission = transmissions[0];
                currentMessage = 0;
                hasReachedEnd = false;

                showMessage();
            }
        }

        document.querySelectorAll(".continue-link[data-message]").forEach((choice) => {
            choice.addEventListener("click", (event) => {
                event.preventDefault();

                const index = Number(choice.dataset.message);
                currentTransmission = transmissions[index];
                currentMessage = 0;

                showMessage();
            });
        });

        
        function showMessage() {
            messageContent.innerHTML = currentTransmission[currentMessage]
                .replace(/\n/g, "<br>");

            nextButton.style.display = "inline-block";
            previousButton.style.display =
                currentMessage > 0 ? "inline-block" : "none";

            closeButton.style.display =
                hasReachedEnd ? "inline-block" : "none";

            nextButton.textContent = "1. Next...";
            previousButton.textContent = "2. Previous...";

            if (currentMessage === 0) {
                closeButton.textContent = "2. Close and continue...";
            } else {
                closeButton.textContent = "3. Close and continue...";
            }

            previousButton.nextElementSibling.style.display =
                currentMessage > 0 ? "block" : "none";
        }

        nextButton.addEventListener("click", (event) => {
            event.preventDefault();

            if (currentMessage < currentTransmission.length - 1) {
                currentMessage++;
                showMessage();
            } else {
                hasReachedEnd = true;
                messageContent.textContent = "You say thank you and continue on your way.";

                nextButton.style.display = "none";
                previousButton.style.display = "inline-block";
                previousButton.textContent = "1. Previous...";

                closeButton.style.display = "inline-block";
                closeButton.textContent = "2. Close and continue...";
            }
        });

        previousButton.addEventListener("click", (event) => {
            event.preventDefault();

            if (messageContent.textContent === "You say thank you and continue on your way.") {
                currentMessage = currentTransmission.length - 1;
            } else if (currentMessage > 0) {
                currentMessage--;
            }

            showMessage();
        });

        closeButton.addEventListener("click", (event) => {
            event.preventDefault();

            alertBox.classList.remove("show");
            messageBox.classList.remove("show");

            closeButton.style.display = "none";
        });
    </script>
</body>
</html>
