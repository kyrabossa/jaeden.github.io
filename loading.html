<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        body {
            cursor: url("cursor.png") 0 0, auto;
        }

        * {
            box-sizing: border-box;
        }

        @font-face {
            font-family: "Box Font";
            src: url("ST01R.TTF") format("truetype");
        }

        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        .loading-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .loading-screen img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .full-screen {
            clip-path: inset(0 100% 0 0);
            animation: fill-bar 5s linear forwards;
        }

        @keyframes fill-bar {
            from {
                clip-path: inset(0 100% 0 0);
            }

            to {
                clip-path: inset(0 0 0 0);
            }
        }
        
        .instruction {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;

            font-family: "Box Font", sans-serif;
            font-size: clamp(8px, 1.25cqw, 16px);
            line-height: 1.4;
            color: white;
            text-align: center;
            z-index: 10;

            margin: 0;
            padding: 0;

            opacity: 0;
            pointer-events: none;
        }

        .instruction.show {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }
    
    </style>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <img src="loading-empty.png" alt="Loading screen">

        <img
            src="loading-full.png"
            class="full-screen"
            alt=""
        >
        <div class="instruction" id="instruction">
            Please click anywhere to continue.
        </div>
    </div>

    <script>
        const loadingScreen = document.getElementById("loadingScreen");
        const instruction = document.getElementById("instruction");

        let loadingFinished = false;

        setTimeout(() => {
            loadingFinished = true;
            instruction.classList.add("show");
        }, 5000);

        document.addEventListener("click", () => {
            if (loadingFinished) {
                window.location.href = "index.html";
            }
        });

        document.addEventListener("keydown", (event) => {
            if (
                loadingFinished &&
                (event.key === "Enter" || event.key === " ")
            ) {
                window.location.href = "index.html";
            }
        });
    </script>

</body>
</html>
