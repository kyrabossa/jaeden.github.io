
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start</title>

    <style>
        body {
            cursor: url("cursor.png") 0 0, auto;
        }

        button:hover,
        a:hover {
            cursor: url("cursor-hover.png") 0 0, pointer;
        }
        
        .beacon:hover {
            cursor: url("cursor-hover.png") 0 0, pointer;
        }

        .beacon.unavailable:hover {
            cursor: url("cursor.png") 0 0, auto;
        }

        body {
            margin: 0;
            background: black;
        }

        .ship-screen {
            container-type: inline-size;

            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .ship-background {
            display: block;
            width: 100%;
            height: auto;
        }

        .ready-text {
            position: absolute;

            left: 39.53%;
            top: 0%;
            width: 16.867%;

            height: auto;
            animation: ready-blink 1s steps(1, end) infinite;
        }

        @keyframes ready-blink {
            0%, 49% {
                content: url("ready-white.png");
            }

            50%, 100% {
                content: url("ready-yellow.png");
            }
        }

        .jump-button {
            position: absolute;
            left: 41.7%;
            top: 4.6875%;
            width: 5.86%;
            height: 4.167%;

            border: none;
            background: transparent;
            cursor: pointer;
        }
        
    
        .map-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.65);
        }

        .map-overlay.open {
            display: flex;
        }

        .map-panel {
            position: relative;
            width: 100%;
        }

        .map-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .route-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            opacity: 0;
            pointer-events: none;
        }
        .route-lines.current-route {
            opacity: 1;
        }

        .star-glow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .map-ship-orbit {
            position: absolute;
            width: 10%;
            aspect-ratio: 1;
            z-index: 5;
            pointer-events: none;
            animation: ship-orbit 8s linear infinite;
        }

        .map-ship-orbit img {
            position: absolute;
            width: 169.1%;
            height: auto;
            left: 80%;
            top: 45%;
            transform: translate(-50%, -50%);
        }

        @keyframes ship-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .beacon {
            position: absolute;
            width: 3%;
            aspect-ratio: 1;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .beacon img {
            display: block;
            position: absolute;

            width: 563.67%;
            height: auto;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            object-fit: contain;
            pointer-events: none;
        }

        .beacon[data-star="1"] { left: 37.92%; top: 50%; }
        .beacon[data-star="2"] { left: 46.26647%; top: 32.03125%; }
        .beacon[data-star="3"] { left: 53.147877%; top: 43.61979%; }
        .beacon[data-star="4"] { left: 43.55%; top: 67.578125%; }
        .beacon[data-star="5"] { left: 58.931%; top: 72.786%; }
        .beacon[data-star="6"] { left: 70.058565%; top: 52.4739583%; }
        .beacon[data-star="7"] { left: 76.866764%; top: 32.9427%; }

        .map-exit-button {
            position: absolute;

            left: 73.1332%;
            top: 86.71875%;
            width: 9.736456808%;
            height: 4.296875%;

            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }

        .beacon.unavailable {
            cursor: default;
        }
    </style>
</head>

<body data-current-star="1">
    <div class="ship-screen">
        <img
            src="start.png"
            class="ship-background"
            alt="Ship screen"
        >

        <img
            src="ready-white.png"
            class="ready-text"
            alt="Ready"
        >

        <button
            class="jump-button"
            aria-label="Open beacon map"
            title="Open beacon map"
        ></button>

        
    <!-- map -->
    <div class="map-overlay" id="mapOverlay">
        <div class="map-panel">

            <img src="map.png" alt="Beacon map" class="map-image">

            <img src="lines-1.png" class="route-lines" id="lines-1" alt="">
            <img src="lines-2.png" class="route-lines" id="lines-2" alt="">
            <img src="lines-3.png" class="route-lines" id="lines-3" alt="">
            <img src="lines-4.png" class="route-lines" id="lines-4" alt="">
            <img src="lines-5.png" class="route-lines" id="lines-5" alt="">
            <img src="lines-6.png" class="route-lines" id="lines-6" alt="">
            <img src="lines-7.png" class="route-lines" id="lines-7" alt="">

            <img src="glow-1.png" class="star-glow" id="glow-1" alt="">
            <img src="glow-2.png" class="star-glow" id="glow-2" alt="">
            <img src="glow-3.png" class="star-glow" id="glow-3" alt="">
            <img src="glow-4.png" class="star-glow" id="glow-4" alt="">
            <img src="glow-5.png" class="star-glow" id="glow-5" alt="">
            <img src="glow-6.png" class="star-glow" id="glow-6" alt="">
            <img src="glow-7.png" class="star-glow" id="glow-7" alt="">

            <div class="map-ship-orbit" id="mapShipOrbit">
                <img src="map-ship.png" alt="Your ship">
            </div>

            <starting>
            <button class="beacon start-beacon" data-star="1"
                    aria-label="Starting beacon">
                <img src="star-blue.png" alt="">
            </button>

            <button class="beacon" data-star="2" aria-label="Beacon 2">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="3" aria-label="Beacon 3">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="4" aria-label="Beacon 4">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="5" aria-label="Beacon 5">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="6" aria-label="Beacon 6">
                <img src="star-yellow.png" alt="">
            </button>

            <button class="beacon" data-star="7" aria-label="Beacon 7">
                <img src="star-yellow.png" alt="">
            </button>
            
            <button
                class="map-exit-button"
                id="mapExitButton"
                aria-label="Close map"
            ></button>
        </div>
    </div>
    </div>

    <audio id="sector-music" src="sector-music.mp3" autoplay loop></audio>

    <script>
        const jumpButton = document.querySelector(".jump-button");
        const mapOverlay = document.getElementById("mapOverlay");
        const mapPanel = document.querySelector(".map-panel");

        // map
        jumpButton.addEventListener("click", () => {
            mapOverlay.classList.add("open");

            requestAnimationFrame(() => {
                positionShipOrbit();
            });
        });

        const mapExitButton = document.getElementById("mapExitButton");

        mapExitButton.addEventListener("click", (event) => {
            event.stopPropagation();
            mapOverlay.classList.remove("open");
        });

        const connections = {
            1: [2, 3, 4],
            2: [1, 3],
            3: [1, 2, 4, 5],
            4: [1, 3, 5],
            5: [3, 4, 6],
            6: [5, 7],
            7: [6]
        };

        const currentStar = Number(document.body.dataset.currentStar);
        const visitableStars = connections[currentStar] || [];

        const currentBeacon = document.querySelector(
            '.beacon[data-star="' + currentStar + '"]'
        );

        const mapShipOrbit = document.getElementById("mapShipOrbit");

        function positionShipOrbit() {
            if (!currentBeacon || !mapShipOrbit) return;

            const beaconRect = currentBeacon.getBoundingClientRect();
            const mapRect = mapPanel.getBoundingClientRect();

            if (mapRect.width === 0 || mapRect.height === 0) return;

            const x =
                ((beaconRect.left + beaconRect.width / 2 - mapRect.left)
                / mapRect.width) * 100;

            const y =
                ((beaconRect.top + beaconRect.height / 2 - mapRect.top)
                / mapRect.height) * 100;

            mapShipOrbit.style.left = (x - 1) + "%";
            mapShipOrbit.style.top = (y - 1) + "%";
            mapShipOrbit.style.marginLeft = "-5%";
            mapShipOrbit.style.marginTop = "-5%";
        }

        // stars
        document.querySelectorAll(".beacon").forEach((beacon) => {
            const starNumber = Number(beacon.dataset.star);
            const starImage = beacon.querySelector("img");
            const routeImage = document.getElementById("lines-" + starNumber);
            const glowImage = document.getElementById("glow-" + starNumber);

            if (!visitableStars.includes(starNumber)) {
                beacon.classList.add("unavailable");
            } else {
                beacon.classList.remove("unavailable");
            }

            if (starNumber === currentStar && routeImage) {
                routeImage.classList.add("current-route");
            }

            if (
                starNumber === 1 ||
                localStorage.getItem("beacon-" + starNumber) === "visited"
            ) {
                starImage.src = "star-blue.png";
                beacon.removeAttribute("title");
            } else {
                beacon.title = "An unvisited location.";
            }

            beacon.addEventListener("mouseenter", () => {
                if (routeImage) {
                    routeImage.style.opacity = "1";
                }
                
                if (glowImage) {
                    glowImage.style.opacity =
                        starNumber !== currentStar &&
                        visitableStars.includes(starNumber)
                            ? "1"
                            : "0";
                }
            });

            beacon.addEventListener("mouseleave", () => {
                if (routeImage) {
                    routeImage.style.opacity =
                        starNumber === currentStar ? "1" : "0";
                }

                if (glowImage) {
                    glowImage.style.opacity = "0";
                }
            });

            // visit
            beacon.addEventListener("click", (event) => {
                event.stopPropagation();

                if (!visitableStars.includes(starNumber)) {
                    return;
                }

                localStorage.setItem("beacon-" + starNumber, "visited");
                starImage.src = "star-blue.png";
                beacon.removeAttribute("title");

                mapOverlay.classList.remove("open");

                window.location.href = starNumber === 1
                    ? "start.html"
                    : "destination-" + starNumber + ".html";
            });
        });
    </script>

</body>
</html>
